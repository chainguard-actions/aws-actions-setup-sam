name: Test SAM CLI setup with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "1.127.0"
      - name: Assert sam is on PATH
        run: |
          echo "Checking sam CLI is available..."
          if ! command -v sam &>/dev/null; then
            echo "FAIL: sam command not found on PATH"
            exit 1
          fi
          echo "PASS: sam found at $(command -v sam)"
      - name: Assert sam version matches requested version
        run: |
          echo "Running sam --version..."
          VERSION_OUTPUT=$(sam --version 2>&1)
          echo "Output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q "1.127.0"; then
            echo "FAIL: expected version 1.127.0 but got: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: sam version 1.127.0 confirmed"
