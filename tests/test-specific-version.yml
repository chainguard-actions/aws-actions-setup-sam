name: Test SAM CLI setup with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-sam
        uses: .
        with:
          version: "1.127.0"
          token: ${{ github.token }}
      - name: Assert sam is on PATH
        run: |
          echo "Checking sam is available on PATH..."
          if ! command -v sam &>/dev/null; then
            echo "FAIL: sam command not found on PATH"
            exit 1
          fi
          echo "PASS: sam found at $(command -v sam)"
      - name: Assert correct version installed
        run: |
          echo "Running sam --version..."
          SAM_VERSION=$(sam --version 2>&1)
          echo "actual: $SAM_VERSION"
          if echo "$SAM_VERSION" | grep -q "1.127.0"; then
            echo "PASS: correct version 1.127.0 installed"
          else
            echo "FAIL: expected version 1.127.0 but got: $SAM_VERSION"
            exit 1
          fi
