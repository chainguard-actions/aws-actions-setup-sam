name: Test SAM CLI setup using native installer
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-sam
        uses: .
        with:
          use-installer: "true"
          token: ${{ github.token }}
      - name: Assert sam is on PATH
        run: |
          echo "Checking sam is available on PATH after native installer..."
          if ! command -v sam &>/dev/null; then
            echo "FAIL: sam command not found on PATH"
            exit 1
          fi
          echo "PASS: sam found at $(command -v sam)"
      - name: Assert sam version output
        run: |
          echo "Running sam --version..."
          SAM_VERSION=$(sam --version 2>&1)
          echo "actual: $SAM_VERSION"
          if [ -z "$SAM_VERSION" ]; then
            echo "FAIL: sam --version returned empty output"
            exit 1
          fi
          echo "PASS: sam --version returned: $SAM_VERSION"
